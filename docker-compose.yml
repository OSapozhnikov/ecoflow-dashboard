services:
  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    container_name: ecoflow-server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - ECOFLOW_ACCESS_KEY=${ECOFLOW_ACCESS_KEY}
      - ECOFLOW_SECRET_KEY=${ECOFLOW_SECRET_KEY}
      - ECOFLOW_API_BASE_URL=${ECOFLOW_API_BASE_URL:-https://api-e.ecoflow.com}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      # MQTT Configuration (Optional)
      - ECOFLOW_MQTT_ENABLED=${ECOFLOW_MQTT_ENABLED:-false}
      - ECOFLOW_MQTT_BROKER_URL=${ECOFLOW_MQTT_BROKER_URL:-mqtt://mqtt.ecoflow.com:1883}
      - ECOFLOW_MQTT_AUTH_TYPE=${ECOFLOW_MQTT_AUTH_TYPE:-access_key}
      - ECOFLOW_MQTT_USERNAME=${ECOFLOW_MQTT_USERNAME:-}
      - ECOFLOW_MQTT_PASSWORD=${ECOFLOW_MQTT_PASSWORD:-}
      - ECOFLOW_MQTT_EMAIL=${ECOFLOW_MQTT_EMAIL:-}
      - ECOFLOW_MQTT_CLIENT_ID=${ECOFLOW_MQTT_CLIENT_ID:-}
      # WebSocket Configuration (Optional)
      - WEBSOCKET_ENABLED=${WEBSOCKET_ENABLED:-true}
      - WEBSOCKET_PATH=${WEBSOCKET_PATH:-/ws}
    networks:
      - ecoflow-network
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  client:
    build:
      context: .
      dockerfile: ./client/Dockerfile
    container_name: ecoflow-client
    ports:
      - "80:80"
    networks:
      - ecoflow-network
    depends_on:
      server:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ecoflow-network:
    driver: bridge

